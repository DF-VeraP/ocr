server {
    listen 80;
    server_name _;

    # Permitir carga de PDFs grandes (ej. 50+ páginas)
    client_max_body_size 150M;

    # Compresión gzip para máxima velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 1. Servir archivos estáticos del Frontend compilado (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Caché eficiente para recursos estáticos versionados
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Proxy inverso hacia la API Backend con soporte para Server-Sent Events (SSE)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Directivas anti-buffering indispensables para streaming SSE (/stream)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Tiempos de espera extendidos para procesamiento de lotes grandes
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 3. Proxy hacia archivos estáticos de uploads del backend (fotos de rostros)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
